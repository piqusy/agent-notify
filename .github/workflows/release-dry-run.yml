name: Release Dry Run
run-name: release-dry-run-v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to preview without leading v
        required: true
        default: 0.2.11
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: v${{ inputs.version }}

concurrency:
  group: release-dry-run-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preview-release:
    name: Preview Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age=259200

      - name: Validate version input
        run: |
          VERSION="${{ inputs.version }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid version: $VERSION" >&2; exit 1; }

      - name: Check release files
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Build custom release body preview
        run: |
          .github/scripts/build-release-body.sh \
            "${{ inputs.version }}" \
            release-body.md \
            release-changelog.md

      - name: Generate GitHub release notes preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -vx "$RELEASE_TAG" | head -1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' > release-generated-notes.md
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.body' > release-generated-notes.md
          fi

      - name: Combine release notes preview
        run: |
          cp release-body.md release-notes-preview.md
          printf '\n' >> release-notes-preview.md
          cat release-generated-notes.md >> release-notes-preview.md

      - name: Upload preview artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview-${{ env.RELEASE_TAG }}
          path: |
            release-body.md
            release-changelog.md
            release-generated-notes.md
            release-notes-preview.md

      - name: Add workflow summary
        run: |
          {
            echo "## Release preview $RELEASE_TAG"
            echo
            echo "This workflow only previews release notes and build artifacts. It does not create or update a GitHub Release."
            echo
            cat release-notes-preview.md
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Preview (${{ matrix.outfile }})
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: darwin
            arch: arm64
            outfile: agent-notify-darwin-arm64
            bun_target: bun-darwin-arm64
            binary_name: agent-notify
            sign_binary: true
            stage_helper: true
          - platform: darwin
            arch: x64
            outfile: agent-notify-darwin-x64
            bun_target: bun-darwin-x64
            binary_name: agent-notify
            sign_binary: true
            stage_helper: true
          - platform: linux
            arch: arm64
            outfile: agent-notify-linux-arm64
            bun_target: bun-linux-arm64
            binary_name: agent-notify
            sign_binary: false
            stage_helper: false
          - platform: linux
            arch: x64
            outfile: agent-notify-linux-x64
            bun_target: bun-linux-x64
            binary_name: agent-notify
            sign_binary: false
            stage_helper: false
          - platform: windows
            arch: x64
            outfile: agent-notify-windows-x64
            bun_target: bun-windows-x64
            binary_name: agent-notify.exe
            sign_binary: false
            stage_helper: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version input
        run: |
          VERSION="${{ inputs.version }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid version: $VERSION" >&2; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age=259200

      - name: Check release files
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Build JS packages
        run: bun run build

      - name: Compile standalone binary (${{ matrix.outfile }})
        run: |
          mkdir -p dist/${{ matrix.outfile }}/bin
          bun build cli/src/index.ts \
            --compile \
            --outfile dist/${{ matrix.outfile }}/bin/${{ matrix.binary_name }} \
            --target ${{ matrix.bun_target }}

      - name: Ad-hoc sign binary (${{ matrix.outfile }})
        if: ${{ matrix.sign_binary }}
        run: codesign --sign - --force dist/${{ matrix.outfile }}/bin/${{ matrix.binary_name }}

      - name: Stage OpenCode plugin bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist/${{ matrix.outfile }}/opencode-agent-notify
          cp packages/opencode/package.json dist/${{ matrix.outfile }}/opencode-agent-notify/
          cp -R packages/opencode/dist dist/${{ matrix.outfile }}/opencode-agent-notify/

      - name: Stage Claude Code hook bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist/${{ matrix.outfile }}/claude-code/hooks
          cp packages/claude-code/README.md dist/${{ matrix.outfile }}/claude-code/
          cp -R packages/claude-code/hooks/. dist/${{ matrix.outfile }}/claude-code/hooks/

      - name: Stage Pi extension bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist/${{ matrix.outfile }}/pi-coding-agent
          cp packages/pi-coding-agent/README.md dist/${{ matrix.outfile }}/pi-coding-agent/
          cp packages/pi-coding-agent/src/agent-notify.ts dist/${{ matrix.outfile }}/pi-coding-agent/

      - name: Stage macOS helper app (${{ matrix.outfile }})
        if: ${{ matrix.stage_helper }}
        run: |
          mkdir -p dist/${{ matrix.outfile }}/agent-notify-helper
          cp -R packages/macos-helper/dist/AgentNotify.app dist/${{ matrix.outfile }}/agent-notify-helper/

      - name: Upload build artifact preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.outfile }}
          path: dist/${{ matrix.outfile }}
          if-no-files-found: error

  smoke:
    name: Smoke Preview (${{ matrix.outfile }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            outfile: agent-notify-linux-x64
            binary_name: agent-notify
          - os: windows-latest
            outfile: agent-notify-windows-x64
            binary_name: agent-notify.exe

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.outfile }}
          path: dist/${{ matrix.outfile }}

      - name: Smoke test Linux binary and backend path
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p ci-bin
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "printf '%s\\n' \"\$*\" > \"\$RUNNER_TEMP/notify-send-args.txt\"" \
            'exit 0' > ci-bin/notify-send
          chmod +x ci-bin/notify-send
          export PATH="$PWD/ci-bin:$PATH"

          binary="dist/${{ matrix.outfile }}/bin/${{ matrix.binary_name }}"
          chmod +x "$binary"
          "$binary" --help > /dev/null
          "$binary" --version
          "$binary" status --tool smoke-test
          "$binary" test 'done' --force

          test -f "$RUNNER_TEMP/notify-send-args.txt"
          grep -F -- "Test — Done" "$RUNNER_TEMP/notify-send-args.txt"

      - name: Smoke test Windows binary and backend path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shimDir = Join-Path $PWD "ci-bin"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          $shimPath = Join-Path $shimDir "powershell.cmd"
          @"
          @echo off
          setlocal
          > "%RUNNER_TEMP%\powershell-args.txt" echo %*
          exit /b 0
          "@ | Set-Content -Path $shimPath -Encoding ASCII
          $env:PATH = "$shimDir;$env:PATH"

          $binary = "dist/${{ matrix.outfile }}/bin/${{ matrix.binary_name }}"
          & $binary --help | Out-Null
          & $binary --version
          & $binary status --tool smoke-test
          & $binary test done --force

          $argsFile = Join-Path $env:RUNNER_TEMP "powershell-args.txt"
          if (!(Test-Path $argsFile)) {
            throw "powershell shim was not invoked"
          }

          $captured = Get-Content $argsFile -Raw
          if ($captured -notmatch '-EncodedCommand\s+([^\s]+)') {
            throw "Encoded PowerShell payload not found in shim invocation"
          }

          $encoded = $Matches[1]
          $decoded = [System.Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($encoded))
          if ($decoded -notmatch 'Test — Done') {
            throw "Decoded PowerShell payload did not contain the expected notification title"
          }

  package-preview:
    name: Package Preview Artifacts
    needs: [preview-release, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Restore executable permissions before archiving
        run: |
          set -euo pipefail
          shopt -s nullglob

          # actions/download-artifact strips execute bits, so restore the files
          # that must stay runnable in the preview archives.
          for binary in dist/agent-notify-darwin-*/bin/agent-notify dist/agent-notify-linux-*/bin/agent-notify
          do
            chmod +x "$binary"
          done

          for helper in dist/agent-notify-darwin-*/agent-notify-helper/AgentNotify.app/Contents/MacOS/AgentNotify
          do
            chmod +x "$helper"
          done

          for hook in dist/agent-notify-*/claude-code/hooks/*.sh
          do
            chmod +x "$hook"
          done

      - name: Create preview archives
        run: |
          set -euo pipefail
          cd dist
          tar -czf agent-notify-darwin-arm64.tar.gz agent-notify-darwin-arm64
          tar -czf agent-notify-darwin-x64.tar.gz agent-notify-darwin-x64
          tar -czf agent-notify-linux-arm64.tar.gz agent-notify-linux-arm64
          tar -czf agent-notify-linux-x64.tar.gz agent-notify-linux-x64
          zip -qr agent-notify-windows-x64.zip agent-notify-windows-x64
          sha256sum \
            agent-notify-darwin-arm64.tar.gz \
            agent-notify-darwin-x64.tar.gz \
            agent-notify-linux-arm64.tar.gz \
            agent-notify-linux-x64.tar.gz \
            agent-notify-windows-x64.zip > checksums.txt
          cat checksums.txt

      - name: Verify preview archive executable permissions
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          check_tar_archive() {
            local archive="$1"
            local package_dir="$2"
            local extracted_root="$tmpdir/$package_dir"

            mkdir -p "$extracted_root"
            tar -xzf "dist/$archive" -C "$extracted_root"

            test -x "$extracted_root/$package_dir/bin/agent-notify"

            for hook in "$extracted_root/$package_dir"/claude-code/hooks/*.sh; do
              test -x "$hook"
            done
          }

          check_tar_archive agent-notify-darwin-arm64.tar.gz agent-notify-darwin-arm64
          check_tar_archive agent-notify-darwin-x64.tar.gz agent-notify-darwin-x64
          check_tar_archive agent-notify-linux-arm64.tar.gz agent-notify-linux-arm64
          check_tar_archive agent-notify-linux-x64.tar.gz agent-notify-linux-x64

          test -x "$tmpdir/agent-notify-darwin-arm64/agent-notify-darwin-arm64/agent-notify-helper/AgentNotify.app/Contents/MacOS/AgentNotify"
          test -x "$tmpdir/agent-notify-darwin-x64/agent-notify-darwin-x64/agent-notify-helper/AgentNotify.app/Contents/MacOS/AgentNotify"

      - name: Upload preview release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-preview-${{ env.RELEASE_TAG }}
          path: |
            dist/agent-notify-darwin-arm64.tar.gz
            dist/agent-notify-darwin-x64.tar.gz
            dist/agent-notify-linux-arm64.tar.gz
            dist/agent-notify-linux-x64.tar.gz
            dist/agent-notify-windows-x64.zip
            dist/checksums.txt

      - name: Add packaging summary
        run: |
          {
            echo "## Release artifact preview $RELEASE_TAG"
            echo
            echo "Built release-like archives and uploaded them as workflow artifacts without touching the real GitHub Release or Homebrew workflows."
            echo
            echo "Artifacts:"
            echo "- release-preview-$RELEASE_TAG (notes preview)"
            echo "- release-artifacts-preview-$RELEASE_TAG (archives + checksums)"
          } >> "$GITHUB_STEP_SUMMARY"
